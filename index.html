<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nisha Fashion Careers</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7f0ff, #eef7ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.10);
    }
    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6c4df6;
      color: white;
      font-size: 30px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      color: #222;
    }
    p {
      color: #666;
      line-height: 1.6;
      margin: 0 auto 26px;
    }
    a.button {
      display: block;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 12px;
      margin: 12px 0;
      font-weight: 700;
      font-size: 16px;
    }
    .telegram {
      background: #229ed9;
      color: white;
    }
    .contact {
      background: #222;
      color: white;
    }
    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">N</div>
    <h1>Nisha Fashion Careers</h1>
    <p>For career opportunities and enquiries, connect with us on Telegram.</p>

    <a class="button telegram" href="https://t.me/Nisha_FashionCareers" target="_blank" rel="noopener">
      Join on Telegram
    </a>

    <a class="button contact" href="https://t.me/Nisha_FashionCareers" target="_blank" rel="noopener">
      Contact Us
    </a>

    <div class="footer">© 2026 Nisha Fashion Careers</div>
  </main>
</body>
</html>
